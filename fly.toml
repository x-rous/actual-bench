# Fly.io settings for Actual Bench.
#
# Step-by-step guide: https://x-rous.github.io/actual-bench/administration/fly-io/
#
#   fly launch --name your-app-name --ha=false
#
# The name you choose becomes your address (https://your-app-name.fly.dev);
# `fly launch` writes it, and the region nearest you, into this file.
# Open the app straight after launch and set your password.
#
# - No other settings are needed. Actual server addresses and keys are entered
#   in the app; the key protecting stored automation credentials is created on
#   first start and kept on the /data volume.
# - One Machine, always on: Actual Bench runs scheduled automations (backups,
#   bank sync, budget sync) itself, and a Machine stopped for inactivity would
#   stop them too. The volume below belongs to that one Machine.
# - Pin a version for predictable upgrades, e.g. xrous/actual-bench:1.3.6.

# Disk used as overflow memory, for a little headroom on a small machine.
swap_size_mb = 512

[build]
  image = 'xrous/actual-bench:latest'

# Automations open budgets in their own worker, each with its own memory. On
# this machine size, one at a time with 256 MB each leaves room for the app;
# a budget too large for that fails its run cleanly instead of taking the app
# down. Raise both, with `memory` below, for very large budgets.
[env]
  ACTUAL_BENCH_WORKERS_MAX = '1'
  ACTUAL_BENCH_WORKER_HEAP_MB = '256'

[[mounts]]
  source = 'actual_bench_data'
  destination = '/data'
  initial_size = '1gb' # The smallest Fly offers; plenty for Actual Bench.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
