# fly.toml — Fly.io deployment template for Actual Bench
#
# This is a template, not a config tied to any one Fly app: `fly launch --from
# <this repo>` copies it into a new app of your own. Do not deploy straight
# into an app named "actual-bench-template" — `fly launch --generate-name`
# (or your own --name) picks the real name.
#
# Quick start:
#   fly launch --from https://github.com/x-rous/actual-bench --generate-name --ha=false
#
# No secrets or environment variables are required. The Actual server URL and
# API key are entered in the browser UI, not set here. Automations' stored
# credentials are encrypted with a vault key Bench generates on first start and
# keeps on the /data volume (secrets/vault.key). To hold that key yourself
# instead, `fly secrets set ACTUAL_BENCH_VAULT_KEY=...` before the first deploy;
# see docs-site/administration/configuration.
#
# This app runs Actual Bench's own in-process automation scheduler (unattended
# sync, scheduled bank sync, backups). auto_stop_machines is "off" on purpose:
# a Machine that scales to zero on inactivity silently stops that scheduler
# too, which is a correctness bug, not a cost optimization, for anyone who
# actually enables an unattended job. If you only use Bench interactively and
# never enable those, you can opt into auto_stop/auto_start yourself — but
# that is not this template's default.
#
# Persistence: [mounts] attaches a Fly Volume at /data, matching
# ACTUAL_BENCH_DB_PATH's default. Fly Volumes are local to one Machine, not
# shared/replicated network storage — this is why the deployment model below
# is a single Machine, not multiple.
#
# To pin to a specific version instead of always pulling latest, change
# the image tag below, e.g. xrous/actual-bench:1.3.5

app = "actual-bench-template"
primary_region = "iad"

[build]
  image = "xrous/actual-bench:latest"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "actual_bench_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
