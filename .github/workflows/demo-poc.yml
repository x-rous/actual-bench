name: Demo container proof of concept
on:
  push:
    branches: [feat/demo-launch-refresh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build demo image
        run: docker build -f demo/Dockerfile.poc -t actual-bench-demo-poc .
      - name: Smoke test and restart under Space limits
        run: bash demo/smoke-poc.sh
      - name: Show logs on failure
        if: failure()
        run: docker logs actual-bench-demo-poc || true
