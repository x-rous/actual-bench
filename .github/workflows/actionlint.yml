name: Workflow lint

# Static checks for the workflow files themselves: expression and syntax errors,
# unknown inputs, and shell mistakes in `run:` steps, which otherwise surface
# only when the affected workflow next runs on main.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
