name: Demo container
on:
  push:
    branches: [main]
    paths: &demo_paths
      - "demo/**"
      - "src/**"
      - "public/**"
      - "scripts/copy-sqlite-wasm.mjs"
      - "scripts/copy-pdfjs-assets.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "jest.setup.ts"
      - ".dockerignore"
      - ".github/workflows/demo.yml"
  pull_request:
    paths: *demo_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: demo/Dockerfile
          load: true
          push: false
          tags: actual-bench-demo
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo
      - name: Smoke test and restart under Space limits
        run: bash demo/smoke.sh
        env:
          DEMO_BROWSER_SMOKE: 1
      - name: Show logs on failure
        if: failure()
        run: docker logs actual-bench-demo || true
