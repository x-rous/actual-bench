name: Docker Smoke Test

# Builds docker/Dockerfile.prod and proves the resulting image actually boots,
# becomes healthy, and persists its metadata database across a container
# replacement. Independent of the required `lint-and-test` check in CI —
# nothing today builds or runs this image before it ships (release.yml and
# edge.yml build and push it, but never start it), so this closes that gap
# without adding a slow Docker build to every PR's required check.

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.prod"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/docker-smoke.yml"
  pull_request:
    paths:
      - "docker/Dockerfile.prod"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/docker-smoke.yml"

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.prod
          load: true
          push: false
          tags: actual-bench:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a persistent volume and start the container
        run: |
          docker volume create actual-bench-smoke-data
          docker run -d \
            --name actual-bench-smoke \
            -p 3000:3000 \
            -v actual-bench-smoke-data:/data \
            actual-bench:smoke-test

      - name: Wait for /api/health to report ready
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health never returned 200"
          docker logs actual-bench-smoke
          exit 1

      - name: Wait for the Docker HEALTHCHECK to report healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' actual-bench-smoke)
            if [ "$status" = "healthy" ]; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Container never reported healthy (last status: ${status})"
          docker logs actual-bench-smoke
          exit 1

      - name: Confirm the app responds and the metadata DB is initialized
        run: |
          curl -sf http://127.0.0.1:3000/ > /dev/null
          body=$(curl -sf http://127.0.0.1:3000/api/app-db/health)
          echo "$body"
          created_at=$(echo "$body" | node -e '
            const body = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!body.ready || !body.writable || !body.schemaVersion || !body.createdAt) {
              console.error("app-db/health did not report a ready, writable, initialized database");
              process.exit(1);
            }
            process.stdout.write(body.createdAt);
          ')
          echo "APP_DB_CREATED_AT=$created_at" >> "$GITHUB_ENV"

      - name: Confirm automation worker threads start in the production image
        # Jest cannot start a real worker on the TypeScript entry; this is the
        # check that the compiled worker ships in the standalone build and runs.
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf http://127.0.0.1:3000/api/automations/health || true)
            status=$(echo "$body" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => (raw += chunk));
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(raw).workers?.preflight?.status ?? "missing"); }
                catch { process.stdout.write("unreadable"); }
              });
            ')
            if [ "$status" = "ready" ]; then
              echo "Worker threads ready after ${i} attempt(s)."
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "::error::Worker preflight failed: $body"
              docker logs actual-bench-smoke
              exit 1
            fi
            sleep 2
          done
          echo "::error::Worker preflight never reported ready (last: ${status})"
          docker logs actual-bench-smoke
          exit 1

      - name: Stop the container and start a replacement on the same volume
        run: |
          docker stop actual-bench-smoke
          docker rm actual-bench-smoke
          docker run -d \
            --name actual-bench-smoke-2 \
            -p 3000:3000 \
            -v actual-bench-smoke-data:/data \
            actual-bench:smoke-test

      - name: Confirm the database survived the replacement
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          body=$(curl -sf http://127.0.0.1:3000/api/app-db/health)
          echo "$body"
          echo "$body" | APP_DB_CREATED_AT="$APP_DB_CREATED_AT" node -e '
            const body = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!body.ready || !body.schemaVersion || body.createdAt !== process.env.APP_DB_CREATED_AT) {
              console.error("Replacement container did not see the same initialized database (createdAt mismatch)");
              process.exit(1);
            }
          '

      - name: Clean up
        if: always()
        run: |
          docker rm -f actual-bench-smoke actual-bench-smoke-2 2>/dev/null || true
          docker volume rm actual-bench-smoke-data 2>/dev/null || true
