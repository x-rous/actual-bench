version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Raised from 5. The cap was being reached, and a saturated queue is silent:
  # `next` sat on published criticals for weeks without a pull request, because
  # five unrelated updates were already holding every slot.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Packages that have to move together, or neither moves at all. React
    # refuses to run when react and react-dom disagree, and Jest expects its
    # core and its environment to match - so split across separate pull
    # requests, each one fails on its own and both sit red indefinitely.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      jest:
        patterns:
          - "jest"
          - "jest-environment-*"
          - "@types/jest"
      # Everything else that is a minor or patch bump, in one pull request. A
      # dependency lands in the first group it matches, so the two above keep
      # their members. Majors still arrive one at a time.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Babel 8 installs, and the tests pass on it, but npm reports peer
      # conflicts: Jest's own Babel plugins still declare @babel/core ^7, so
      # the tree is only working by being overridden. Revisit when Jest's
      # Babel packages declare 8. @babel/core is only used by one test.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-typescript"
        update-types: ["version-update:semver-major"]
      # Must describe the Node actually in use, or the type checker starts
      # accepting code the runtime cannot run. Moves when Node does.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript up to 6.0 (checked November 2026:
      # its range is >=4.8.4 <6.1.0), and eslint-config-next fails to load with 7
      # installed, so the bump breaks lint outright. Revisit when the parser
      # ships support.
      - dependency-name: "typescript"
        versions: [">=7"]

  # The documentation site has its own lockfile and was watched by nothing.
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The base images were watched by nothing at all, so an image pinned to an
  # exact Node patch never picked up an Alpine security refresh - which is how a
  # published OpenSSL advisory stayed in the shipped image. Pinning exactly is
  # still right for reproducible builds; it just needs something proposing the
  # bumps.
  - package-ecosystem: docker
    directories:
      - "/docker"
      - "/demo"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A Node major is a coordinated move across both Dockerfiles, the CI
      # matrix and the type packages. Proposed as a major it arrives weekly and
      # looks routine - and its checks look green, because the container is
      # only built on pushes to main, so a pull request never builds it at all.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
