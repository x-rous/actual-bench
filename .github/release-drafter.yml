name-template: 'Actual Bench v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

branches:
  - main

# Changes are sorted by the type in their title, not by the label on the pull
# request.
#
# The label was one step too many. It is written once, when the pull request is
# opened, and is then a fact about that pull request forever - so a title
# corrected after the label was applied left the two disagreeing, and the notes
# followed the label. Two entries in the last draft sat in the wrong section for
# exactly that reason, and putting them right meant editing labels on merged
# pull requests rather than fixing anything.
#
# Reading the title at draft time closes that gap. There is nothing to keep in
# sync, a retitle is simply picked up, and a pull request merged before any of
# this existed is categorised on the same terms as one merged today.
#
# The autolabeler still runs, so labels remain for filtering and search. Nothing
# here depends on them being right.
categories:
  - title: '🚀 Features'
    when:
      conventional:
        type: 'feat'

  - title: '🐛 Bug Fixes'
    when:
      conventional:
        type: 'fix'

  - title: '🔧 Maintenance'
    when:
      conventional:
        types:
          - 'chore'
          - 'refactor'
          - 'perf'
          - 'build'
          - 'ci'
          - 'style'
          - 'test'
          - 'revert'
          - 'docs'

  # Everything the categories above did not take. A changelog category with no
  # condition is the documented catch-all, and at most one may omit `when`.
  #
  # It exists so that a miss looks like a miss. Uncategorised changes are
  # otherwise printed loose under no heading, which is how a whole class of
  # mislabelled entries went unnoticed: they were in the notes, just nowhere.
  - title: '📌 Uncategorised'

  # Version resolution. `type: version-resolver` categories decide the next
  # version without rendering a section of their own, and replace the
  # deprecated top-level `version-resolver:` block, which warns on every run.
  #
  # Every release is a patch unless a pull request says otherwise. A feature
  # does not force a minor bump on its own - that previously proposed v1.3.0
  # where a patch v1.2.6 was wanted - so the opt-in stays a deliberate label
  # rather than a side effect of the title.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'

change-template: '- $TITLE (#$NUMBER)'

# Labels, for filtering and search. The categories above do not use them.
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?!?:/i'
  - label: 'maintenance'
    title:
      - '/^(chore|refactor|perf|build|ci|style|test|revert)(\(.+\))?!?:/i'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/x-rous/actual-bench/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
