name-template: 'Actual Bench v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

branches:
  - main

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
  - title: '🔧 Maintenance'
    labels:
      - 'maintenance'
      - 'docs'
      # Dependabot applies this itself. The autolabeler reaches its pull
      # requests too, so this is a second route to the same place rather than
      # the only one - worth keeping, since a bump that arrives without a
      # conventional title still lands where it belongs.
      - 'dependencies'
  # Anything that reached main without one of the labels above. Uncategorised
  # entries are otherwise printed loose, under no heading, which is how a
  # mislabelled change goes unnoticed: it is still in the notes, just nowhere.
  #
  # No labels at all, deliberately. `'*'` is not a wildcard here - it would be
  # read as the name of a label called "*", which nothing carries, and the
  # category would sit empty while the changes it was meant to catch went on
  # being printed loose. A changelog category with no condition is the
  # documented way to say "everything the earlier ones did not take"; at most
  # one may do so.
  - title: '📌 Uncategorised'

change-template: '- $TITLE (#$NUMBER)'

# Labels come from the pull request's title, not its branch.
#
# The branch was the wrong source. It named the work when it started, and the
# work moves: #295 was cut as `refactor/…`, turned into a bug fix, and was filed
# under Maintenance; #262 was cut as `feat/…`, shipped as `fix(reconciliation)`,
# and was filed under Features. `chore/…` had no rule at all, so every chore PR
# was silently uncategorised - which is what these notes were reporting.
#
# The title is the honest source: this repository writes every PR title as
# `type(scope): description`, and that type is a statement about what the change
# turned out to be rather than what it was called on the day it was branched.
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?!?:/i'
  - label: 'maintenance'
    title:
      # Everything that is neither a feature nor a fix nor documentation. Perf
      # sits here rather than under Features: it changes how well the product
      # does something it already did, which is not news to a reader scanning
      # for what is new.
      - '/^(chore|refactor|perf|build|ci|style|test|revert)(\(.+\))?!?:/i'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/x-rous/actual-bench/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Default every release to a patch bump. A minor/major bump is opt-in via an
# explicit 'minor'/'major' label on a PR — feature PRs still appear under the
# "🚀 Features" section above, but no longer force a minor version bump on their
# own (which previously auto-proposed e.g. v1.3.0 instead of a patch v1.2.6).
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'fix'
      - 'maintenance'
      - 'docs'
      - 'feature'
      - 'dependencies'
  default: patch
