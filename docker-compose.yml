services:
  actual-bench:
    image: xrous/actual-bench:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ACTUAL_BENCH_DB_PATH: /data/actual-bench.sqlite
      # --- Optional settings (uncomment to use) ---
      # Server log verbosity: debug | info (default) | warn | error
      # LOG_LEVEL: info
      # Credential vault key. Optional: without it Bench generates one into
      # /data/secrets/vault.key. Set it only to hold the key yourself:
      # ACTUAL_BENCH_VAULT_KEY: "<strong-secret>"
    volumes:
      - actual-bench-data:/data
    restart: unless-stopped

volumes:
  actual-bench-data:
